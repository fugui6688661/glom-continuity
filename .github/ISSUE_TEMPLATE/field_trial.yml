name: Share a trial / 试用记录
description: What survived a new session or handoff? Successful and failed trials both help.
title: "[Trial]: "
body:
  - type: markdown
    attributes:
      value: |
        This report will be public. Use synthetic examples and replace personal paths with placeholders.
        Do not upload credentials, private chats, company files, project databases or raw doctor output.
        这里提交的内容会公开。请使用虚构案例；不要上传密钥、私聊、公司文件、项目数据库或未经脱敏的诊断输出。
        Public Alpha.5 and dev4 source have different capabilities; please identify which you used.
  - type: input
    id: version
    attributes:
      label: Tool and installation / 工具与安装
      description: --version plus release ZIP, wheel or source commit; no personal executable path.
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Host and platform / 助手与系统
      description: Assistant version, OS, Python and CLI/MCP/manual route. No account details.
    validations:
      required: true
  - type: dropdown
    id: scenario
    attributes:
      label: Scenario / 使用场景
      options:
        - Single assistant, new session / 单助手新会话
        - Handoff between assistants / 两个助手接力
        - Setup or version diagnosis / 安装与版本辨认
        - Other / 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Task and steps / 虚构任务与复现步骤
      description: What should the next session remember? Include one important constraint or unknown.
    validations:
      required: true
  - type: dropdown
    id: outcome
    attributes:
      label: Observed outcome / 实际结果
      options:
        - Recovered and continued / 已恢复并继续
        - Recovered but could not continue / 恢复了但未能继续
        - Incorrect or missing context / 上下文错误或遗漏
        - Could not set up / 安装或接入失败
        - Not yet verified / 尚未核实
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: What did you check? / 你实际核对了什么
      description: Redacted commands/results, retained or missing constraints, and whether output was inspected. Do not paste a full transcript.
    validations:
      required: true
  - type: textarea
    id: measurements
    attributes:
      label: Measurements, if any / 测量，可不填
      description: Number of trials, setup time, repeated explanations or a matched baseline. Write not measured rather than guessing savings.
  - type: checkboxes
    id: privacy
    attributes:
      label: Public data review / 公开内容检查
      options:
        - label: I reviewed this report and removed private material. / 我已检查并移除了私有资料。
          required: true
