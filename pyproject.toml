[build-system]
requires = ["setuptools>=77.0.3,<85", "wheel>=0.45,<0.49"]
build-backend = "setuptools.build_meta"

[project]
name = "glom-continuity"
dynamic = ["version"]
description = "Local project checkpoints and reviewable handoffs across AI assistants."
readme = "README.en.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "fugui6688661"}]
dependencies = []
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3"]

[project.optional-dependencies]
mcp = ["mcp==2.2.0"]

[project.scripts]
glom-continuity = "glom_continuity.continuity:main"
glom-continuity-demo = "glom_continuity.smoke_demo:main"
glom-continuity-mcp = "glom_continuity.mcp_server:main"

[project.urls]
Source = "https://github.com/fugui6688661/glom-continuity"

[tool.setuptools]
packages = ["glom_continuity"]
package-dir = {glom_continuity = "scripts"}
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "glom_continuity.continuity.VERSION"}
